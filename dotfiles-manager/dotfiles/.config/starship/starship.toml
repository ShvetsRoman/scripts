
#:schema ./config-schema.json

# ============================================================
# STARSHIP — КОНФІГУРАЦІЯ ДЛЯ ZSH
# ============================================================
# Тема: Catppuccin Mocha / Nordic
# Оболонка: Zsh
# Розташування файлів:
# ~/.config/starship/
# ├── starship.toml
# └── config-schema.json
# JSON Schema використовується редактором Neovim через
# TOML Language Server (Taplo) для автодоповнення,
# перевірки параметрів і відображення підказок.
# ============================================================

# ============================================================
# 1. ЗАГАЛЬНІ НАЛАШТУВАННЯ
# ============================================================

# Додавати порожній рядок між завершеною командою
# та наступним запрошенням термінала.
add_newline = true

# Максимальний час пошуку файлів для визначення
# проєкту або середовища (у мілісекундах).
scan_timeout = 30

# Максимальний час виконання зовнішньої команди,
# яку Starship запускає для отримання інформації.
command_timeout = 800

# Використовувати визначену нижче палітру кольорів.
palette = "catppuccin_mocha"

# ============================================================
# 2. ФОРМАТ ЗАПРОШЕННЯ (PROMPT)
# ============================================================
# Перший рядок:
#   ОС + користувач + SSH + каталог + Git +
#   мови програмування + Docker + тривалість команди
#
# Другий рядок:
#   Символ введення команди.
# Праворуч:
#   Фонові завдання та поточний час.
#
# Символ "\" наприкінці рядка прибирає
# зайві пробіли й перенесення між модулями.
#
# $line_break створює другий рядок.
# $character відображає символ введення.
# ============================================================

format = """
$os\
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$git_state\
$python\
$nodejs\
$rust\
$golang\
$docker_context\
${custom.docker_all}\
${custom.docker_partial}\
${custom.docker_none}\
$cmd_duration\
$line_break\
$character"""

# Модулі праворуч від основного запрошення.
right_format = "$jobs$time"

# ============================================================
# 3. КОЛЬОРОВА ПАЛІТРА CATPPUCCIN MOCHA
# ============================================================
# Кольори можна використовувати за назвами:
# blue   — синій
# green  — зелений
# red    — червоний
# yellow — жовтий
# mauve  — фіолетовий
# peach  — персиковий
# sky    — блакитний
# dimmed — приглушений текст.
# ============================================================

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext = "#a6adc8"
overlay = "#6c7086"
surface = "#45475a"

# ============================================================
# 4. ОПЕРАЦІЙНА СИСТЕМА
# ============================================================
# Показує значок поточного дистрибутива Linux.
# Arch Linux — 󰣇
# Fedora     — 󰣛
# Ubuntu     — 󰕈
# Debian     — 󰣚
# disabled = false — модуль увімкнений.
# ============================================================

[os]
disabled = false
# $symbol — значок операційної системи.
# $style — стиль, визначений нижче.
format = "[$symbol ]($style)"
style = "bold blue"

# Значки окремих дистрибутивів.
[os.symbols]
Arch = "󰣇"
Fedora = "󰣛"
Ubuntu = "󰕈"
Debian = "󰣚"
Linux = "󰌽"

# ============================================================
# 5. ІМ'Я КОРИСТУВАЧА
# ============================================================
# За звичайних умов ім'я користувача приховане.
# Воно може з'являтися, коли користувач root
# або коли інші умови Starship вимагають його показу.
# show_always = true — показувати завжди.
# ============================================================

[username]
show_always = false
# Колір звичайного користувача.
style_user = "green"
# Колір користувача root.
style_root = "bold red"
format = "[$user]($style) "

# ============================================================
# 6. ІМ'Я КОМП'ЮТЕРА / SSH
# ============================================================
# Відображає hostname під час SSH-підключення.
# Наприклад:
# @server
# ssh_only = true:
#   Показувати hostname лише під час SSH-сесії.
# ============================================================

[hostname]
ssh_only = true
style = "bold yellow"
format = "[@$hostname]($style) "

# ============================================================
# 7. ПОТОЧНИЙ КАТАЛОГ
# ============================================================
# Показує каталог, у якому виконується команда.
# Приклади:
# ~/.config/nvim
# ~/scripts_bash/dotfiles-manager
# truncation_length = 3:
#   Показувати максимум три компоненти шляху
#   за стандартних умов скорочення.
# truncation_symbol:
#   Символ для прихованих частин шляху.
# truncate_to_repo = false:
#   Не змінювати правило скорочення лише через
#   перебування всередині Git-репозиторію.
# ============================================================

[directory]
style = "bold blue"
format = "[$path]($style)[$read_only]($read_only_style) "
# Як позначати домашній каталог.
home_symbol = "~"
# Кількість компонентів шляху.
truncation_length = 5
# Позначення скороченого шляху.
truncation_symbol = "…/"
# Не скорочувати шлях примусово до кореня Git.
truncate_to_repo = false
# Значок каталогу без дозволу на запис.
read_only = " 󰌾"
# Колір індикатора read-only.
read_only_style = "red"

# ============================================================
# 8. ПОТОЧНА ГІЛКА GIT
# ============================================================
# Відображає назву поточної Git-гілки.
# Наприклад:
#  main
#  develop
#  feature/login
# Показується тільки всередині Git-репозиторію.
# ============================================================

[git_branch]
# Символ Git-гілки.
symbol = " "
# Колір назви гілки.
style = "bold mauve"
format = "[$symbol$branch]($style) "

# ============================================================
# 9. СТАН GIT-РЕПОЗИТОРІЮ
# ============================================================
# Показує локальні зміни в Git.
# Позначення:
# ? — нові файли, які Git ще не відстежує
# ! — змінені файли
# + — файли, додані в staging area
# ✘ — видалені файли
# » — перейменовані файли
# = — конфлікти злиття
# ⇡ — локальна гілка попереду remote
# ⇣ — локальна гілка позаду remote
# ⇕ — гілки розійшлися
# ============================================================

[git_status]
style = "bold yellow"
# Показувати блок лише за наявності відповідного стану.
format = '([$all_status$ahead_behind]($style) )'
# Конфлікти злиття.
conflicted = " =${count} "
# Локальні коміти, не відправлені на remote.
ahead = " ⇡${count}"
# Коміти remote, відсутні локально.
behind = " ⇣${count}"
# Локальна та віддалена гілки розійшлися.
diverged = " ⇕⇡${ahead_count} ⇣${behind_count}"
# Невідстежувані файли.
untracked = " ?${count}"
# Збережені git stash зміни.
stashed = " 󰏗${count}"
# Змінені файли.
modified = " !${count}"
# Файли в staging area.
staged = " +${count}"
# Перейменовані файли.
renamed = " »${count}"
# Видалені файли.
deleted = " ✘${count}"

# ============================================================
# 10. ПОТОЧНИЙ СТАН ОПЕРАЦІЙ GIT
# ============================================================
# Відображає активні Git-операції:
# REBASING
# MERGING
# CHERRY-PICKING
# REVERTING
# BISECTING
# Під час rebase також показує прогрес.
# Наприклад:
# REBASING 2/5
# ============================================================

[git_state]
style = "bold red"
format = '[$state( $progress_current/$progress_total)]($style) '

# ============================================================
# 11. PYTHON
# ============================================================
# Показує версію Python у відповідному проєкті.
# Може відображати назву активного
# віртуального середовища (venv).
# Наприклад:
# via  v3.13.0 (venv)
# ============================================================

[python]
symbol = " "
style = "yellow"
format = 'via [$symbol$version( \($virtualenv\))]($style) '

# ============================================================
# 12. NODE.JS
# ============================================================
# Показує версію Node.js, коли Starship
# визначає відповідний проєкт або середовище.
# Наприклад:
# via  v22.0.0
# ============================================================

[nodejs]
symbol = " "
style = "green"
format = "via [$symbol$version]($style) "

# ============================================================
# 13. RUST
# ============================================================
# Показує версію Rust у Rust-проєктах.
# Наприклад:
# via  v1.85.0
# ============================================================

[rust]
symbol = " "
style = "peach"
format = "via [$symbol$version]($style) "

# ============================================================
# 14. GOLANG
# ============================================================
# Показує версію Go у відповідних проєктах.
# Наприклад:
# via  v1.24.0
# ============================================================

[golang]
symbol = " "
style = "sky"
format = "via [$symbol$version]($style) "

# ============================================================
# DOCKER — УСІ КОНТЕЙНЕРИ ЗАПУЩЕНІ
# ============================================================

[custom.docker_all]

disabled = false

description = "Усі Docker-контейнери запущені"

when = 'bash "$HOME/.config/starship/docker-status.sh" all >/dev/null'

command = 'bash "$HOME/.config/starship/docker-status.sh" all'

symbol = "  "

style = "bold fg:#a6e3a1"

format = "[$symbol$output]($style) "


# ============================================================
# DOCKER — ЧАСТИНА КОНТЕЙНЕРІВ ЗАПУЩЕНА
# ============================================================

[custom.docker_partial]

disabled = false

description = "Частина Docker-контейнерів запущена"

when = 'bash "$HOME/.config/starship/docker-status.sh" partial >/dev/null'

command = 'bash "$HOME/.config/starship/docker-status.sh" partial'

symbol = "  "

style = "bold fg:#f9e2af"

format = "[$symbol$output]($style) "


# ============================================================
# DOCKER — УСІ КОНТЕЙНЕРИ ЗУПИНЕНІ
# ============================================================

[custom.docker_none]

disabled = false

description = "Docker-контейнери зупинені"

when = 'bash "$HOME/.config/starship/docker-status.sh" none >/dev/null'

command = 'bash "$HOME/.config/starship/docker-status.sh" none'

symbol = "  "

style = "bold fg:#f38ba8"

format = "[$symbol$output]($style) "

# ============================================================
# 16. ТРИВАЛІСТЬ ВИКОНАННЯ КОМАНДИ
# ============================================================
# Показує, скільки часу виконувалася
# попередня команда.
# min_time = 2000:
#   Показувати час лише для команд,
#   які виконувалися щонайменше 2 секунди.
# ============================================================

[cmd_duration]
# Мінімальна тривалість у мілісекундах.
min_time = 2000

# Не показувати мілісекунди.
show_milliseconds = false
style = "bold yellow"
format = "󱎫 [$duration]($style) "

# ============================================================
# 17. ФОНОВІ ЗАВДАННЯ
# ============================================================
# Показує кількість фонових процесів,
# запущених із поточної оболонки.
# Наприклад:
# sleep 60 &
# Тоді у prompt може з'явитися:
# 󰜎 1
# ============================================================

[jobs]
symbol = "󰜎 "
style = "bold peach"
format = "[$symbol$number]($style) "

# ============================================================
# 18. ПОТОЧНИЙ ЧАС
# ============================================================

[time]
disabled = false
# 24-годинний формат.
time_format = "%H:%M"
# Приглушений колір.
style = "dimmed overlay"
format = "[$time]($style)"

# ============================================================
# 19. СИМВОЛ ВВЕДЕННЯ КОМАНД
# ============================================================
# Відображає результат попередньої команди.
# Зелений ➜ — команда завершилася успішно.
# Червоний ➜ — команда завершилася з помилкою.
# Для Zsh Vi-mode:
# ➜ — режим введення (insert).
# ❮ — командний режим (normal).
# ============================================================

[character]
disabled = false
# Успішне виконання попередньої команди.
success_symbol = "[➜](bold green)"
# Попередня команда завершилася з помилкою.
error_symbol = "[➜](bold red)"
# Vi normal mode.
vimcmd_symbol = "[❮](bold mauve)"
# Vi replace-one mode.
vimcmd_replace_one_symbol = "[❮](bold peach)"
# Vi replace mode.
vimcmd_replace_symbol = "[❮](bold peach)"
# Vi visual mode.
vimcmd_visual_symbol = "[❮](bold yellow)"

# ============================================================
# 20. ВИМКНЕНІ МОДУЛІ
# ============================================================

# Інформація про версію пакета проєкту.
[package]
disabled = true

# Amazon Web Services.
[aws]
disabled = true

# Google Cloud.
[gcloud]
disabled = true

# Microsoft Azure.
[azure]
disabled = true
