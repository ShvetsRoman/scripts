# ============================================================
# NAT — Masquerade, перенаправлення портів і Hairpin NAT
# ============================================================
# Усі приклади нижче закоментовані та не впливають на конфігурацію.
# Активні значення збережені без змін.
# Символ @ у значенні позначає посилання на логічний ресурс.
#
# ПРИКЛАД — WAN port forwarding (неактивний, доки рядки закоментовані):
# [forward.example_web]
# protocol = "tcp"
# wan_port = 8080
# to_address = "192.168.88.100"
# to_port = 80
# dst_address = ""  # порожнє значення: dst-address не додається
# tcp_new_limit = 30
# Для Hairpin NAT потрібні hairpin_enabled=true, hairpin_lan_subnet і непорожня зовнішня dst_address.

# Декларативні ресурси RouterOS 7. Посилання — логічні ID, назви — довільні.


# Розділ [nat]: параметри ресурсу nat.
[nat]
# enabled: Увімкнути або вимкнути цей ресурс (true / false).
enabled = true
# masquerade: Підміняти вихідну адресу трафіку, що виходить через WAN.
masquerade = true

# Hairpin NAT для доступу з LAN до власної публічної IP-адреси (за замовчуванням вимкнено).
# hairpin_enabled: Увімкнути Hairpin NAT для доступу з LAN через зовнішню адресу; типовий стан false.
hairpin_enabled = false
# Обов'язково тільки при hairpin_enabled = true.
# hairpin_lan_subnet: LAN-підмережа для Hairpin NAT; потрібна тільки при ввімкненні Hairpin.
hairpin_lan_subnet = "192.168.88.0/24"

# Приклад, вимкнений за замовчуванням (щоб увімкнути — розкоментувати):
# [forward.web]
# protocol = "tcp"
# wan_port = 8080
# to_address = "192.168.88.100"
# to_port = 80
# dst_address = "203.0.113.7"  # необов’язково; порожнє значення ігнорується
# tcp_new_limit = 30
