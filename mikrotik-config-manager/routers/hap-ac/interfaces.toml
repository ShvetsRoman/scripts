# enabled: Увімкнути або вимкнути цей ресурс (true / false).
enabled = true
# comment: Текстовий опис ресурсу, що відображається у RouterOS.
comment = "physical_port"


# Розділ [interfaces.ether4]: параметри ресурсу interfaces.ether4.
[interfaces.ether4]
# name: Ім’я ресурсу в RouterOS.
name = "01_lan3"
# enabled: Увімкнути або вимкнути цей ресурс (true / false).
enabled = true
# comment: Текстовий опис ресурсу, що відображається у RouterOS.
comment = "physical_port"


# Розділ [interfaces.ether5]: параметри ресурсу interfaces.ether5.
[interfaces.ether5]
# name: Ім’я ресурсу в RouterOS.
name = "01_lan4"
# enabled: Увімкнути або вимкнути цей ресурс (true / false).
enabled = true
# comment: Текстовий опис ресурсу, що відображається у RouterOS.
comment = "physical_port"


# Розділ [interfaces.wlan1]: параметри ресурсу interfaces.wlan1.
[interfaces.wlan1]
# name: Ім’я ресурсу в RouterOS.
