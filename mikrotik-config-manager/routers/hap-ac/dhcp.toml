# ============================================================
# DHCP — DHCP-пул, сервер і параметри клієнтів
# ============================================================
# Усі приклади нижче закоментовані та не впливають на конфігурацію.
# Активні значення збережені без змін.
# Символ @ у значенні позначає посилання на логічний ресурс.
#
# ПРИКЛАД: start = "192.168.88.100" та end = "192.168.88.200" — динамічний пул.
# Статичні прив’язки налаштовувати окремо у leases.toml.

# Декларативні ресурси RouterOS 7. Посилання — логічні ID, назви — довільні.


# Розділ [pool.lan]: параметри ресурсу pool.lan.
[pool.lan]
# name: Ім’я ресурсу в RouterOS.
name = "pool-lan"
# start: Перша адреса динамічного DHCP-діапазону.
start = "192.168.88.100"
# end: Остання адреса динамічного DHCP-діапазону.
end = "192.168.88.200"


# Розділ [server.lan]: параметри ресурсу server.lan.
[server.lan]
# name: Ім’я ресурсу в RouterOS.
name = "dhcp-server"
# enabled: Увімкнути або вимкнути цей ресурс (true / false).
enabled = true
# interface: Логічне посилання на інтерфейс; значення @... визначається в інших TOML.
interface = "@bridge.lan"
# pool: Посилання на DHCP-пул за логічним ID.
pool = "@pool.lan"
# lease_time: Тривалість оренди DHCP (наприклад, 12h).
lease_time = "12h"


# Розділ [network.lan]: параметри ресурсу network.lan.
[network.lan]
# gateway: IP шлюзу, який отримають DHCP-клієнти.
gateway = "192.168.88.1"
# dns_servers: Список DNS-адрес, які видаються DHCP-клієнтам.
dns_servers = ["192.168.88.1"]

# ============================================================
# ОБ’ЄДНАНО ІЗ LEASES.TOML — окремого файла більше немає.
# ============================================================

# ============================================================
# LEASES — Статичні прив’язки адрес DHCP
# ============================================================
# Усі приклади нижче закоментовані та не впливають на конфігурацію.
# Активні значення збережені без змін.
# Символ @ у значенні позначає посилання на логічний ресурс.
#
# ПРИКЛАД — закріпити адресу за пристроєм (прибрати # на початку рядків):
# [leases.example_pc]
# address = "192.168.88.10"
# mac = "02:11:22:33:44:55"
# comment = "example-pc"

# Декларативні ресурси RouterOS 7. Посилання — логічні ID, назви — довільні.


# Розділ [leases]: параметри ресурсу leases.
[leases]
# enabled: Увімкнути або вимкнути цей ресурс (true / false).
enabled = true
# server: Параметр server розділу leases; зберігайте тип значення.
server = "@server.lan"


# Розділ [leases.lease_02]: параметри ресурсу leases.lease_02.
[leases.lease_02]
# address: IP-адреса або мережа; формат залежить від цього розділу.
address = "192.168.88.2"
# mac: Параметр mac розділу leases.lease_02; зберігайте тип значення.
mac = "44:DF:65:6C:14:07"
# comment: Текстовий опис ресурсу, що відображається у RouterOS.
comment = "mi_repiter"


