# ============================================================
# LISTS — Логічні списки інтерфейсів LAN/WAN
# ============================================================
# Усі приклади нижче закоментовані та не впливають на конфігурацію.
# Активні значення збережені без змін.
# Символ @ у значенні позначає посилання на логічний ресурс.
#
# ПРИКЛАД: members = ["@wan"] — додати WAN-інтерфейс до логічного списку.

# Декларативні ресурси RouterOS 7. Посилання — логічні ID, назви — довільні.


# Розділ [lists.wan]: параметри ресурсу lists.wan.
[lists.wan]
# name: Ім’я ресурсу в RouterOS.
name = "WAN"
# enabled: Увімкнути або вимкнути цей ресурс (true / false).
enabled = true
# members: Список логічних інтерфейсів у групі WAN/LAN.
members = ["@wan"]


# Розділ [lists.lan]: параметри ресурсу lists.lan.
[lists.lan]
# name: Ім’я ресурсу в RouterOS.
name = "LAN"
# enabled: Увімкнути або вимкнути цей ресурс (true / false).
enabled = true
# members: Список логічних інтерфейсів у групі WAN/LAN.
members = ["@bridge.lan"]
