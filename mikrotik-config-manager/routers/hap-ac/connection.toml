# ============================================================
# CONNECTION — SSH-з’єднання з маршрутизатором
# ============================================================
# Усі приклади нижче закоментовані та не впливають на конфігурацію.
# Активні значення збережені без змін.
# Символ @ у значенні позначає посилання на логічний ресурс.
#
# ПРИКЛАД: identity_file = "~/.ssh/id_mikrotik_lab" — локальний SSH-ключ.
# Якщо ключ недоступний, CLI може запросити пароль без запису його до TOML.

# Декларативні ресурси RouterOS 7. Посилання — логічні ID, назви — довільні.


# Розділ [connection]: параметри ресурсу connection.
[connection]
# host: IP-адреса або DNS-ім’я маршрутизатора для SSH.
host = "192.168.88.1"
# port: TCP/UDP-порт відповідної служби або SSH-з’єднання.
port = 22
# user: Користувач RouterOS для підключення.
user = "admin"
# identity_file: Шлях до приватного SSH-ключа на комп’ютері; пароль у TOML не зберігати.
identity_file = "~/.ssh/id_mikrotik_lab"
