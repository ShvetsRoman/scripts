# ============================================================
# IPV6 — Налаштування й захист IPv6
# ============================================================
# Усі приклади нижче закоментовані та не впливають на конфігурацію.
# Активні значення збережені без змін.
# Символ @ у значенні позначає посилання на логічний ресурс.
#
# ПРИКЛАД: enabled = false — відключити генерацію IPv6-налаштувань.

# Вимкнено за замовчуванням: тоді правила IPv6 Firewall не створюються.
# Для ввімкнення встановити enabled=true і firewall=true.

# Розділ [ipv6]: параметри ресурсу ipv6.
[ipv6]
# enabled: Увімкнути або вимкнути цей ресурс (true / false).
enabled = false
# firewall: Параметр firewall розділу ipv6; зберігайте тип значення.
firewall = true
