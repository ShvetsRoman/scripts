# ============================================================
# BRIDGE — Міст LAN і порти
# ============================================================
# Усі приклади нижче закоментовані та не впливають на конфігурацію.
# Активні значення збережені без змін.
# Символ @ у значенні позначає посилання на логічний ресурс.
#
# ПРИКЛАД: bridge = "@bridge.lan" — прив’язка LAN-порту до моста.

# Чотири фізичні LAN-порти об’єднані в один Bridge.

# Розділ [bridge.lan]: параметри ресурсу bridge.lan.
[bridge.lan]
# name: Ім’я ресурсу в RouterOS.
name = "bridge-lan"
# enabled: Увімкнути або вимкнути цей ресурс (true / false).
enabled = true
# protocol_mode: Режим протоколу моста; rstp запобігає петлям у мережі.
protocol_mode = "rstp"


# Розділ [ports.ether2]: параметри ресурсу ports.ether2.
[ports.ether2]
# bridge: Посилання на LAN-міст, до якого додається порт.
bridge = "@bridge.lan"
# enabled: Увімкнути або вимкнути цей ресурс (true / false).
enabled = true
# hw: Апаратне прискорення порту, якщо підтримується пристроєм.
hw = false


# Розділ [ports.ether3]: параметри ресурсу ports.ether3.
[ports.ether3]
# bridge: Посилання на LAN-міст, до якого додається порт.
