# ============================================================
# NETWORK — IPv4-адреси локальної мережі та керування
# ============================================================
# Усі приклади нижче закоментовані та не впливають на конфігурацію.
# Активні значення збережені без змін.
# Символ @ у значенні позначає посилання на логічний ресурс.
#
# ПРИКЛАД: address = "192.168.56.2/24" — адреса LAN-інтерфейсу.

# LAN і доступ до адміністрування використовують одну адресу Bridge.
# Host-Only VirtualBox використовує 192.168.56.0/24, керування — на Bridge.

# Розділ [network.lan]: параметри ресурсу network.lan.
[network.lan]
# interface: Логічне посилання на інтерфейс; значення @... визначається в інших TOML.
interface = "@bridge.lan"
# address: IP-адреса або мережа; формат залежить від цього розділу.
address = "192.168.56.2/24"


# Розділ [management]: параметри ресурсу management.
[management]
# interface: Логічне посилання на інтерфейс; значення @... визначається в інших TOML.
interface = "@bridge.lan"
# address: IP-адреса або мережа; формат залежить від цього розділу.
address = "192.168.56.2/24"
# on_lan: Керування розміщено в локальній мережі (LAN).
on_lan = true

# ============================================================
# ОБ’ЄДНАНО ІЗ WAN.TOML — окремого файла більше немає.
# ============================================================

# ============================================================
# WAN — Інтернет-підключення WAN
# ============================================================
# Усі приклади нижче закоментовані та не впливають на конфігурацію.
# Активні значення збережені без змін.
# Символ @ у значенні позначає посилання на логічний ресурс.
#
# ПРИКЛАД: use_peer_dns = false — не приймати DNS від DHCP WAN.

# ether1 отримує WAN-адресу від VirtualBox NAT через DHCP.

# Розділ [wan]: параметри ресурсу wan.
[wan]
# enabled: Увімкнути або вимкнути цей ресурс (true / false).
enabled = true
# interface: Логічне посилання на інтерфейс; значення @... визначається в інших TOML.
interface = "@interfaces.ether1"
# add_default_route: Дозволити DHCP-клієнту WAN додати маршрут за замовчуванням.
add_default_route = true
# use_peer_dns: Використовувати DNS від провайдера через DHCP WAN.
use_peer_dns = false

