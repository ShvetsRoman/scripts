# ============================================================
# SYSTEM — Ім’я роутера, час і NTP
# ============================================================
# Усі приклади нижче закоментовані та не впливають на конфігурацію.
# Активні значення збережені без змін.
# Символ @ у значенні позначає посилання на логічний ресурс.
#
# ПРИКЛАД: timezone = "Europe/Kyiv" — часовий пояс RouterOS.

# Ідентичність роутера. Текст без пробілів для коректного RouterOS CLI.

# Розділ [identity]: параметри ресурсу identity.
[identity]
# name: Ім’я ресурсу в RouterOS.
name = "router-test"

# Часовий пояс України.

# Розділ [clock]: параметри ресурсу clock.
[clock]
# timezone: Часовий пояс RouterOS, наприклад Europe/Kyiv.
timezone = "Europe/Kyiv"

# NTP-сервери RouterOS 7 (масив із максимум чотирьох адрес).

# Розділ [ntp]: параметри ресурсу ntp.
[ntp]
# enabled: Увімкнути або вимкнути цей ресурс (true / false).
enabled = true
# servers: Список IP DNS або адрес NTP — залежно від розділу.
servers = ["0.ua.pool.ntp.org", "1.ua.pool.ntp.org", "2.ua.pool.ntp.org", "3.ua.pool.ntp.org"]

# ============================================================
# ОБ’ЄДНАНО ІЗ SYSTEM-SECURITY.TOML — окремого файла більше немає.
# ============================================================

# ============================================================
# SYSTEM-SECURITY — Користувачі та параметри захисту системи
# ============================================================
# Усі приклади нижче закоментовані та не впливають на конфігурацію.
# Активні значення збережені без змін.
# Символ @ у значенні позначає посилання на логічний ресурс.
#
# ПРИКЛАД: [users.guest] name = "guest", group = "read".
# Пароль додається тільки через окремий файл секретів, не сюди.

# Користувачі: імена та групи описуємо тут, паролі зберігаємо у .secrets.
# Для створення додаткового користувача розкоментуйте цей приклад.
# [users.guest]
# name = "guest"
# group = "read"
# managed = true
# Пароль задайте окремо: USER_GUEST_PASSWORD=... у .secrets.


# Розділ [users.admin]: параметри ресурсу users.admin.
[users.admin]
# name: Ім’я ресурсу в RouterOS.
name = "admin"
# group: Група дозволів користувача RouterOS.
group = "full"
# managed: Керувати користувачем під час початкового налаштування.
managed = true


# Розділ [users.roman]: параметри ресурсу users.roman.
[users.roman]
# name: Ім’я ресурсу в RouterOS.
name = "roman"
# group: Група дозволів користувача RouterOS.
group = "full"
# managed: Керувати користувачем під час початкового налаштування.
managed = true

# Посилення SSH-криптографії RouterOS 7.

# Розділ [ssh]: параметри ресурсу ssh.
[ssh]
# strong_crypto: Увімкнути посилені налаштування SSH RouterOS.
strong_crypto = true

# MAC-доступ адміністратора тільки через логічний LAN Interface List.

# Розділ [mac_access]: параметри ресурсу mac_access.
[mac_access]
# interface_list: Посилання на список інтерфейсів, де доступна служба.
interface_list = "@lists.lan"
# mac_server: Керування через MAC Server лише в обраній зоні.
mac_server = true
# mac_winbox: Доступ MAC WinBox лише в обраній зоні.
mac_winbox = true

# Політика оновлень: без автоматичного встановлення й reboot.

# Розділ [updates]: параметри ресурсу updates.
[updates]
# Не змінюємо канал CHR 7.23.8 long-term під час початкового налаштування.
# Для іншого RouterOS обирайте канал свідомо до генерації RSC.
# channel: Канал оновлень RouterOS, наприклад long-term.
channel = "long-term"
# auto_install: Автоматичне встановлення оновлень (за замовчуванням вимкнено).
auto_install = false
# auto_reboot: Автоматичне перезавантаження після оновлень (вимкнено).
auto_reboot = false

# Прошивку RouterBOARD оновлювати виключно вручну.

# Розділ [routerboard]: параметри ресурсу routerboard.
[routerboard]
# upgrade: Оновлення RouterBOARD; небажане без окремого рішення.
upgrade = false

