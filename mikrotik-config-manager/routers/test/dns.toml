# ============================================================
# DNS — DNS-сервери та DNS-кеш RouterOS
# ============================================================
# Усі приклади нижче закоментовані та не впливають на конфігурацію.
# Активні значення збережені без змін.
# Символ @ у значенні позначає посилання на логічний ресурс.
#
# ПРИКЛАД: allow_remote_requests = true — локальні клієнти використовують DNS роутера.

# Декларативні ресурси RouterOS 7. Посилання — логічні ID, назви — довільні.


# Розділ [dns]: параметри ресурсу dns.
[dns]
# enabled: Увімкнути або вимкнути цей ресурс (true / false).
enabled = true
# servers: Список IP DNS або адрес NTP — залежно від розділу.
servers = ["1.1.1.3", "1.0.0.3"]
# allow_remote_requests: Дозволити локальним клієнтам звертатися до DNS-кешу маршрутизатора.
allow_remote_requests = true
