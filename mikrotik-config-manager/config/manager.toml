# ============================================================
# MANAGER — Загальні параметри менеджера
# ============================================================
# Усі приклади нижче закоментовані та не впливають на конфігурацію.
# Активні значення збережені без змін.
# Символ @ у значенні позначає посилання на логічний ресурс.
#
# ПРИКЛАД: language = "uk" — українська мова CLI.

# Декларативні ресурси RouterOS 7. Посилання — логічні ID, назви — довільні.


# Розділ [manager]: параметри ресурсу manager.
[manager]
# language: Мова інтерфейсу менеджера, наприклад uk.
language = "uk"
# default_router: Профіль маршрутизатора за замовчуванням; порожній рядок — не задано.
default_router = ""
# color: Режим кольорів CLI, наприклад auto.
color = "auto"
