# ============================================================
# CARGO — Параметри складання Rust-проєкту
# ============================================================
# Усі приклади нижче закоментовані та не впливають на конфігурацію.
# Активні значення збережені без змін.
# Символ @ у значенні позначає посилання на логічний ресурс.
#
# ПРИКЛАД: version = "0.0.41" — версія застосунку (не змінювати без випуску).


# Розділ [package]: параметри ресурсу package.
[package]
# name: Метадані пакета Cargo: name; зміна впливає на складання/публікацію.
name = "mikrotik-config-manager"
# version: Метадані пакета Cargo: version; зміна впливає на складання/публікацію.
version = "0.0.41"
# edition: Метадані пакета Cargo: edition; зміна впливає на складання/публікацію.
edition = "2021"
# description: Метадані пакета Cargo: description; зміна впливає на складання/публікацію.
description = "Модульний домашній менеджер конфігурацій RouterOS 7"


# Розділ [bin]: параметри ресурсу bin.
[[bin]]
# name: Метадані пакета Cargo: name; зміна впливає на складання/публікацію.
name = "mikrotik-config-manager"
# path: Параметр path розділу bin; зберігайте тип значення.
path = "src/main.rs"

[dependencies]
toml = "0.8"
serde = { version = "1", features = ["derive"] }
