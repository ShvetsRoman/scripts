#!/usr/bin/env bash

# ============================================================
# ОСНОВНА КОНФІГУРАЦІЯ INSTALLER PACKAGES V1.5
# ============================================================

# Кореневий каталог scripts_bash.
# Очікувана структура:
# scripts_bash/
# ├── dotfiles-manager/
# │   └── dotfiles/
# └── installer-packages/
SCRIPTS_ROOT="$(cd -- "$ROOT_DIR/.." && pwd)"

# Каталог із готовими конфігами проєкту dotfiles-manager.
DOTFILES_DIR="$SCRIPTS_ROOT/dotfiles-manager/dotfiles"

# Копіювати конфіги після встановлення пакетів.
INSTALL_CONFIGS=true

# Створювати резервну копію існуючих конфігів перед заміною.
CONFIG_BACKUP=true

# Каталог резервних копій.
BACKUP_ROOT="$ROOT_DIR/backups"

# Каталог журналів роботи installer.
LOG_ROOT="$ROOT_DIR/log"

# Записувати журнал виконання у файл.
LOG_ENABLED=true

# Якщо true — відсутній source-конфіг є помилкою.
# Якщо false — installer покаже попередження і продовжить роботу.
STRICT_CONFIGS=false

# Якщо true — rsync видаляє з каталогу призначення файли,
# яких немає у source. За замовчуванням вимкнено з міркувань безпеки.
SYNC_DELETE=false

# Автоматично встановлювати залежності модулів.
INSTALL_DEPENDENCIES=true

# Режим dry-run за замовчуванням вимкнений.
DRY_RUN=false

# Автоматичне підтвердження за замовчуванням вимкнене.
ASSUME_YES=false

# Якщо true — встановлюються лише конфіги, без пакетів і сервісних дій.
CONFIGS_ONLY=false
