# ============================================================
# BACKUP-SYNC V2.6.3 — CONFIG
# ============================================================

# Пряме SSH-підключення (використовується, якщо --host не задано).
SSH_IP="10.113.240.145"
SSH_PORT="8022"
SSH_USER="tel"
SSH_KEY="$HOME/.ssh/id_serv"

# Віддалений корінь.
REMOTE_DIR="/data/data/com.arachnoid.sshelper/files/home"

# Локальний корінь.
LOCAL_DIR="$HOME"

# Каталоги відносно LOCAL_DIR / REMOTE_DIR.
BACKUP_DIRS=(
    "00_setup"
    "01_project"
    "03_work"
    "Documents"
    "Music"
    "Pictures"
)

# Виключення (синтаксис rsync --exclude-from).
#   EXCLUDE_FILE — ГЛОБАЛЬНИЙ: застосовується до кожного каталогу з BACKUP_DIRS (лише безпечне: кеші, venv...).
#   EXCLUDE_DIR  — ПОКАНАЛЬНІ: <EXCLUDE_DIR>/<каталог>.conf застосовується лише до цього каталогу
#                  ("/" в імені каталогу замінюється на "__": A/sub -> A__sub.conf).
# Так build/ target/ dist/ виключаються лише в проєктних каталогах (див. exclude.d/01_project.conf),
# а не скрізь, де трапиться каталог з такою назвою (Documents, Pictures...).
# Виключені файли на приймачі НЕ видаляються (немає --delete-excluded).
EXCLUDE_FILE="$SCRIPT_DIR/config/exclude.conf"
EXCLUDE_DIR="$SCRIPT_DIR/config/exclude.d"

# Логи зберігаємо ПОЗА каталогами, які синхронізуються.
STATE_DIR="${XDG_STATE_HOME:-$HOME/.local/state}/backup-sync"
LOG_DIR="$STATE_DIR/log"
KEEP_LOG_DAYS=10

# Recovery. Перед перезаписом / видаленням rsync переміщує стару версію файлу
# в окремий каталог для КОЖНОГО BACKUP_DIRS: <root>/<YYYY-MM-DD_HH-MM-SS>/<каталог>/...
#
# UP   (PC -> SERVER): $REMOTE_DIR/$RECOVERY_ROOT/...
#   RECOVERY_ROOT — одне ім'я каталогу ([A-Za-z0-9._-]); порожнє/зі "/" або ".." скрипт відхиляє.
# DOWN (SERVER -> PC): $LOCAL_RECOVERY_DIR/...  (поза LOCAL_DIR/BACKUP_DIRS!)
#
# ВИМИКАЧІ (recovery діє для напрямку, лише якщо ввімкнені і загальний, і його власний):
#   RECOVERY_ENABLED       — загальний (false = recovery вимкнено повністю)
#   RECOVERY_UP_ENABLED    — для UP   (PC -> SERVER; копії на сервері)
#   RECOVERY_DOWN_ENABLED  — для DOWN (SERVER -> PC; копії локально)
# З CLI на один запуск: --recovery (вмикає, перекриває конфіг) / --no-recovery (вимикає).
# УВАГА: без recovery перезаписані та видалені (mirror!) файли втрачаються безповоротно.
# Ручний ./backup-sync.sh cleanup працює завжди, тож раніше збережені копії можна прибрати й при вимкненому recovery.
RECOVERY_ENABLED=true
RECOVERY_UP_ENABLED=true
RECOVERY_DOWN_ENABLED=true
RECOVERY_ROOT=".backup-sync-recovery"
KEEP_RECOVERY_DAYS=30
LOCAL_RECOVERY_DIR="$STATE_DIR/recovery-down"
KEEP_LOCAL_RECOVERY_DAYS=30

# Автоочищення recovery після УСПІШНОГО up/down (за замовчуванням вимкнено).
#   up   чистить серверний recovery (старші за KEEP_RECOVERY_DAYS),
#   down чистить локальний recovery (старші за KEEP_LOCAL_RECOVERY_DAYS).
# Пропускається при будь-яких помилках синхронізації, у --dry-run і коли recovery вимкнено для цього напрямку.
# Перевизначення з CLI: --auto-cleanup / --no-auto-cleanup. Ручне очищення: ./backup-sync.sh cleanup
AUTO_CLEANUP_RECOVERY=false

# Rsync.
RSYNC_PARTIAL=true
RSYNC_COMPRESS=false
RSYNC_CHECKSUM_VERIFY=true

# Що ще зберігати на додачу до --archive (за замовчуванням вимкнено).
# Обидві сторони (локальний і віддалений rsync) мають це підтримувати — скрипт перевіряє `rsync --version`
# ДО початку роботи і відмовляється, якщо підтримки немає. На Android-сервері ACL/xattrs зазвичай недоступні.
RSYNC_PRESERVE_HARDLINKS=false   # -H: зберігати жорсткі посилання (інакше кожне посилання стає окремим файлом)
RSYNC_PRESERVE_ACLS=false        # -A: зберігати POSIX ACL
RSYNC_PRESERVE_XATTRS=false      # -X: зберігати розширені атрибути

# SSH.
SSH_CONNECT_TIMEOUT=10
SSH_SERVER_ALIVE_INTERVAL=15
# Політика перевірки ключа сервера (known_hosts). Порожнє = поведінка ssh за замовчуванням.
# Через BatchMode=yes перше підключення до невідомого сервера без запису в known_hosts завершується
# помилкою: або один раз підключіться вручну (ssh user@host), або задайте:
#   accept-new — довіряти НОВИМ серверам (TOFU), але відхиляти зміну ключа відомого сервера
#   yes        — лише сервери, що вже є в known_hosts
# Допустимо: "" | yes | no | ask | accept-new  (no — небезпечно, не рекомендується)
SSH_STRICT_HOST_KEY_CHECKING=""

SSH_SERVER_ALIVE_COUNT_MAX=3

# Перевірка вільного місця (перед підтвердженням, лише для реальних up/down).
# Перевіряється ТІЛЬКИ сторона призначення: up -> сервер, down -> локальний диск.
#   MIN_FREE_MIB       — запас у MiB, який має ЛИШИТИСЬ вільним після передачі.
#   SPACE_CHECK_METHOD — dry-run: потрібне місце = обсяг, який rsync передасть (з dry-run, той самий
#                        аналіз показується перед підтвердженням) + запас;
#                        threshold: перевіряється лише запас (без dry-run, швидше).
# Якщо обсяг оцінити не вдалося (помилка dry-run), для цього каталогу враховується лише запас.
# Вимкнути перевірку: --no-space-check.
MIN_FREE_MIB=1024
SPACE_CHECK_METHOD="dry-run"

# Якщо true — sync DOWN також видаляє локальні файли, яких немає на сервері.
# За замовчуванням false: DOWN безпечніший і нічого зайвого локально не видаляє.
DELETE_ON_DOWN=false

# Захист від масового видалення (UP завжди; DOWN — якщо DELETE_ON_DOWN=true).
# MAX_DELETE — макс. кількість видалень на ОДИН каталог; 0 = без ліміту.
# При перевищенні rsync пропускає видалення, каталог позначається як FAIL (код виходу 1).
# Перевизначення з CLI: --max-delete N
MAX_DELETE=500

# false: mirror із ПОРОЖНЬОГО джерела (не змонтований диск, зламаний симлінк) пропускається.
# Перевизначення з CLI: --allow-empty
ALLOW_EMPTY_SOURCE=false

# Перед запитом «Продовжити?» показати dry-run: скільки файлів оновиться/видалиться.
PREVIEW_BEFORE_CONFIRM=true
