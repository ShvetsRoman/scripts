# ============================================================
# BACKUP-SYNC V2.0 — CONFIG
# ============================================================

# Пряме SSH-підключення (використовується, якщо --host не задано).
SSH_IP="10.113.240.145"
SSH_PORT="8022"
SSH_USER="tel"
SSH_KEY="$HOME/.ssh/id_serv"

# Віддалений корінь.
REMOTE_DIR="/data/data/com.arachnoid.sshelper/files/home"

# Локальний корінь.
LOCAL_DIR="$HOME"

# Каталоги відносно LOCAL_DIR / REMOTE_DIR.
BACKUP_DIRS=(
    "00_setup"
    "01_project"
    "03_work"
    "Documents"
    "Music"
    "Pictures"
)

# Exclude-файл.
EXCLUDE_FILE="$SCRIPT_DIR/config/exclude.conf"

# Логи зберігаємо ПОЗА каталогами, які синхронізуються.
STATE_DIR="${XDG_STATE_HOME:-$HOME/.local/state}/backup-sync"
LOG_DIR="$STATE_DIR/log"
KEEP_LOG_DAYS=10

# Recovery для PC -> SERVER.
# Перед перезаписом / видаленням rsync переміщує стару серверну версію сюди.
RECOVERY_ENABLED=true
RECOVERY_ROOT=".backup-sync-recovery"
KEEP_RECOVERY_DAYS=30

# Rsync.
RSYNC_PARTIAL=true
RSYNC_COMPRESS=false
RSYNC_CHECKSUM_VERIFY=true

# SSH.
SSH_CONNECT_TIMEOUT=10
SSH_SERVER_ALIVE_INTERVAL=15
SSH_SERVER_ALIVE_COUNT_MAX=3

# Мінімальний запас вільного місця у MiB.
MIN_FREE_MIB=1024

# Якщо true — sync DOWN також видаляє локальні файли, яких немає на сервері.
# За замовчуванням false: DOWN безпечніший і нічого зайвого локально не видаляє.
DELETE_ON_DOWN=false
