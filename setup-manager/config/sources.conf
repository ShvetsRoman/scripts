# Формат: mode | src | dst | group
#   mode  — home (src відносно $HOME) або abs (src абсолютний)
#   src   — шлях-джерело
#   dst   — шлях у dotfiles/<dst>
#   group — підкаталог backups/<group>/ (dotfiles або recovery)
#
# Заповни через: ./setup.sh sources seed
# Або вручну. Runtime читає ЛИШЕ цей файл.

# ─── Shell ──────────────────────────────────────────────────────────────────
home | .zshrc                 | .zshrc                 | dotfiles
home | .zsh_alias.zsh         | .zsh_alias.zsh         | dotfiles
home | .zsh_path.zsh          | .zsh_path.zsh          | dotfiles
