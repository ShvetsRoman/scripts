# Формат: name | mode | src | dst | group
#   name  — ім'я
#   mode  — home (src відносно $HOME) або abs (src абсолютний)
#   src   — шлях-джерело
#   dst   — шлях у dotfiles/<dst>
#   group — підкаталог backups/<group>/ (dotfiles або recovery)
#
# Додати запис: ./setup.sh sources add NAME MODE SRC DST [GROUP]
# Або вручну. Runtime читає ЛИШЕ цей файл.

# ─── Shell ──────────────────────────────────────────────────────────────────
zsh | home | .zshrc | .zshrc | dotfiles
zsh-alias | home | .zsh_alias.zsh | .zsh_alias.zsh | dotfiles
zsh-path | home | .zsh_path.zsh | .zsh_path.zsh | dotfiles
p10k-my | home | .p10k_my.zsh | .p10k_my.zsh | dotfiles
p10k-nordic | home | .p10k_my_nordic_v1.zsh | .p10k_my_nordic_v1.zsh | dotfiles

