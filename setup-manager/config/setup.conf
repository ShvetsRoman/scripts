# SETUP_VERSION — legacy-значення для зворотної сумісності.
# Реальну версію коду визначає lib/version.sh, який має пріоритет.
SETUP_VERSION="1.3.0"

# SETUP_KEEP_DAYS — скільки днів тримати backup/логи перед очищенням.
SETUP_KEEP_DAYS=30

# SETUP_ARCHIVE_PREFIX — префікс імені архіву (без розширення).
SETUP_ARCHIVE_PREFIX="dotfiles-backup"

# SETUP_BACKUP_ENABLED — чи робити захисну копію перед записом.
SETUP_BACKUP_ENABLED=true

# SETUP_RECOVERY_ENABLED — додатковий прапорець recovery при restore.
# При false --sync-delete для restore відхиляється.
SETUP_RECOVERY_ENABLED=true

# SETUP_LOCK_TIMEOUT — скільки секунд чекати на блокування (0 = не чекати).
# Діапазон: 0..300. Коли інший процес виконує запис, повертається код 75.
SETUP_LOCK_TIMEOUT=0
