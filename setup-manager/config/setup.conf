#!/usr/bin/env bash
# Єдине місце зміни номера версії та основних параметрів.
SETUP_VERSION="1.0.0"
SETUP_COLOR="auto"           # auto | always | never
SETUP_VERBOSE=false
SETUP_BACKUP_ENABLED=true     # захисні копії Installer
SETUP_RECOVERY_ENABLED=true   # захист перед restore
SETUP_ARCHIVE_PREFIX="dotfiles-backup"
SETUP_KEEP_DAYS=30
SETUP_ALLOW_EXTERNAL_SCRIPTS=false # зовнішні install.sh не запускаємо автоматично
