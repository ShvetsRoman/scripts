# SETUP_VERSION — версія. Показується в --version і в doctor.
SETUP_VERSION="1.0.0"

# SETUP_KEEP_DAYS — скільки днів тримати backup/логи перед очищенням.
SETUP_KEEP_DAYS=30

# SETUP_ARCHIVE_PREFIX — префікс імені архіву (без розширення).
SETUP_ARCHIVE_PREFIX="dotfiles-backup"

# SETUP_BACKUP_ENABLED — чи робити захисну копію перед записом.
SETUP_BACKUP_ENABLED=true

# SETUP_RECOVERY_ENABLED — чи писати recovery при restore.
SETUP_RECOVERY_ENABLED=true
