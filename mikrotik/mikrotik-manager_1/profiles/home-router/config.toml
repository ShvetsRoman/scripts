# ============================================================
# UPnP — автопроброс портів (розкоментуйте для ввімкнення)
# ============================================================

# [upnp]
# enabled = true
# external = "@interfaces.ether1"          # WAN-порт
# internal = "@bridge.lan"      # LAN-міст

# ============================================================
# IPV6 — вимкнено (правила Firewall IPv6 не створюються)
# ============================================================

[connection]
host = "192.168.88.1"
user = "admin"
identity_file = "~/.ssh/id_mikrotik_lab"

# Шляхи профілю: усі локальні артефакти залишаються в каталозі цього профілю.
