# ============================================================
# DNS — DNS-кеш роутера та сервери
# ============================================================

[dns]
enabled = true
servers = ["1.1.1.3", "1.0.0.3"]       # Cloudflare Family (фільтрація)
allow_remote_requests = true           # дозволити LAN-клієнтам користуватись DNS роутера

# ============================================================
# NAT — Masquerade та (опційно) Hairpin
# ============================================================

[nat]
enabled = true
masquerade = true                      # підміна адрес для виходу в Інтернет
hairpin_enabled = false                # доступ з LAN до власної публічної IP

# ============================================================
# FIREWALL — базова політика захисту
# ============================================================

[firewall]
enabled = true
allow_icmp = true                      # дозволити ICMP
allow_lan_dhcp = true                  # дозволити DHCP із LAN
input_default_drop = true              # INPUT: забороняти непідтверджене
forward_default_drop = true            # FORWARD: забороняти непідтверджене
lan_to_wan = true                      # дозволити LAN → WAN
fasttrack = false                      # FastTrack вимкнено
drop_new_wan = true                    # блокувати нові з’єднання з WAN
brute_force_enabled = true             # захист SSH/WinBox від перебору (тільки WAN)
brute_force_ports = "22,8291"
brute_force_blacklist_timeout = "1d"
brute_force_stage_timeout = "1m"
icmp_burst = 5
icmp_limit_per_second = 10             # ліміт ICMP з WAN, пакетів/с

# ============================================================
# SERVICES — IP-служби керування
# ============================================================

[services.ssh]
enabled = true
port = 22
limit_to_lan = true                    # SSH лише з LAN

[services.winbox]
enabled = true
port = 8291
limit_to_lan = true                    # WinBox лише з LAN

[services.telnet]
enabled = false                        # незахищений — вимкнено

[services.ftp]
enabled = false

[services.www]
enabled = false

[services.www-ssl]
enabled = false

[services.api]
enabled = false

[services.api-ssl]
enabled = false

[discovery]                            # виявлення сусідів лише в LAN
interface_list = "@lists.lan"

# ============================================================
# SYSTEM — ім’я, час, NTP
# ============================================================

[identity]
name = "router_home"                   # ім’я роутера (без пробілів)

[clock]
timezone = "Europe/Kyiv"

[ntp]
enabled = true
servers = ["0.ua.pool.ntp.org", "1.ua.pool.ntp.org", "2.ua.pool.ntp.org", "3.ua.pool.ntp.org"]

# ============================================================
# SYSTEM-SECURITY — користувачі, SSH, MAC, оновлення
# ============================================================

[users.admin]
name = "admin"
enabled = true
create = true
group = "full"
ssh_keys = ["~/.ssh/id_mikrotik_lab.pub"]
password_file = ".secrets"        # один файл секретів профілю (відносно каталогу профілю)
password_key = "ADMIN_PASSWORD"   # ключ у файлі; паролі в TOML не зберігаються

[users.roman]
name = "roman"
enabled = true
create = true
group = "full"
ssh_keys = ["~/.ssh/id_mikrotik_lab.pub"]
password_file = ".secrets"
password_key = "USER_ROMAN_PASSWORD"

[ssh]
strong_crypto = true                   # посилена криптографія SSH

[mac_access]                           # MAC-доступ лише в LAN
interface_list = "@lists.lan"
mac_server = true
mac_winbox = true

[updates]
channel = "long-term"                  # канал оновлень RouterOS

[routerboard]
supported = true                  # фізичний пристрій із RouterBOARD

# ============================================================
# WIRELESS — Wi-Fi 2.4 / 5 ГГц
# ============================================================

[wireless]
enabled = true
driver = "legacy"                      # legacy → /interface wireless

[wireless.wlan1]                       # 2.4 ГГц
enabled = true
interface = "@interfaces.wlan1"
ssid = "HOME_test"
band = "2ghz-b/g/n"
channel_width = "20mhz"
frequency = "auto"
country = "ukraine"
security = "@security.wifi"
bridge = "@bridge.lan"                 # Wi-Fi входить у міст LAN

[wireless.wlan2]                       # 5 ГГц
enabled = true
interface = "@interfaces.wlan2"
ssid = "HOME_test"
band = "5ghz-a/n/ac"
channel_width = "20/40/80mhz-XXXX"
frequency = "auto"
country = "ukraine"
security = "@security.wifi"
bridge = "@bridge.lan"

[security.wifi]                        # профіль захисту Wi-Fi
name = "home-wifi-security"
authentication = "wpa2-psk"
password_file = ".secrets"            # той самий файл секретів
password_key = "WIFI_PASSWORD"

