# ============================================================
# METADATA — версія схеми та сумісність
# ============================================================
schema_version = "1.0"
generated_for = "RouterOS 7.23.8"
last_updated = "2026-11-03"

# ============================================================
# INTERFACES — фізичні інтерфейси та їхні імена в RouterOS
# ============================================================

[interfaces.ether1]              # WAN-порт
name = "00_wan"
enabled = true
comment = "physical_port"

[interfaces.ether2]              # LAN-порт 1
name = "01_lan1"
enabled = true
comment = "physical_port"

[interfaces.ether3]              # LAN-порт 2
name = "01_lan2"
enabled = true
comment = "physical_port"

[interfaces.ether4]              # LAN-порт 3
name = "01_lan3"
enabled = true
comment = "physical_port"

[interfaces.ether5]              # LAN-порт 4
name = "01_lan4"
enabled = true
comment = "physical_port"

[interfaces.wlan1]               # Wi-Fi 2.4 ГГц
name = "02_wifi_24GHz"
enabled = true
comment = "wireless_pending"

[interfaces.wlan2]               # Wi-Fi 5 ГГц
name = "02_wifi_5GHz"
enabled = true
comment = "wireless_pending"

[interfaces.sfp1]                # SFP-порт (не використовується)
name = "SFP"
enabled = false
comment = "unused"

# ============================================================
# BRIDGE — LAN-міст і порти, що до нього входять
# ============================================================

[bridge.lan]
name = "bridge-lan"
enabled = true
protocol_mode = "rstp"           # rstp — захист від петель

[ports.ether2]                   # ether2 → міст LAN
bridge = "@bridge.lan"
enabled = true
hw = true                        # апаратне прискорення

[ports.ether3]                   # ether3 → міст LAN
bridge = "@bridge.lan"
enabled = true
hw = true

[ports.ether4]                   # ether4 → міст LAN
bridge = "@bridge.lan"
enabled = true
hw = true

[ports.ether5]                   # ether5 → міст LAN
bridge = "@bridge.lan"
enabled = true
hw = true

# ============================================================
# LISTS — логічні списки інтерфейсів WAN / LAN
# ============================================================

[lists.wan]
name = "WAN"
enabled = true
members = ["@interfaces.ether1"]            # явне посилання на інтерфейс WAN

[lists.lan]
name = "LAN"
enabled = true
members = ["@bridge.lan"]        # явне посилання на міст LAN

# ============================================================
# NETWORK — IPv4-адреса LAN-інтерфейсу та керування
# ============================================================

[network.lan]
interface = "@bridge.lan"
address = "192.168.88.1/24"      # адреса роутера в LAN

[management]                     # доступ до керування — лише з LAN
interface = "@bridge.lan"
address = "@network.lan"             # посилання на адресу з [network.lan]
on_lan = true

# ============================================================
# WAN — Інтернет-підключення
# ============================================================

[wan]
enabled = true
interface = "@interfaces.ether1"
add_default_route = true         # додати маршрут за замовчуванням
use_peer_dns = false             # не брати DNS від провайдера

# ============================================================
# DHCP — пул, сервер, параметри мережі та статичні прив’язки
# ============================================================

[pool.lan]                       # динамічний діапазон адрес
name = "pool-lan"
start = "192.168.88.100"
end = "192.168.88.200"

[server.lan]                     # DHCP-сервер на мосту LAN
name = "dhcp-server"
enabled = true
interface = "@bridge.lan"
pool = "@pool.lan"
lease_time = "12h"

[dhcp.network.lan]               # параметри мережі, які отримують клієнти
gateway = "192.168.88.1"         # шлюз для клієнтів
dns_servers = ["192.168.88.1"]   # DNS для клієнтів — сам роутер

[leases]                         # контейнер статичних прив’язок
enabled = true
server = "@server.lan"

