# Setup Manager — порядок секцій визначає порядок встановлення.
# Формат: INI, тільки дані (не Bash).
# hooks = загальні скрипти hooks/<name>.sh.
# hook.<package> = <name> — hook, прив’язаний до пакета.
# config.<package> = <names> — конфіги, прив’язані до пакета.
# depends = <module ...> — необов’язкові міжмодульні залежності тільки для планування.
# configs_group = <group> — явна група з dotfiles.conf.

[base]
title = Base
pacman = base-devel git curl wget rsync unzip zip tar p7zip unace unrar
aur = 
configs_group = 
configs = 
hooks = 

[cli]
title = CLI
pacman = superfile yazi bat eza fd ripgrep fzf jq tree htop btop neovim prettier wl-clipboard fastfetch mc kitty wezterm transmission-qt
aur = 
configs_group = 
configs = nvim kitty wezterm fzf eza bat superfile yazi
hooks = 

