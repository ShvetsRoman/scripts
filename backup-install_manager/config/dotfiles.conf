# Формат: ID | TYPE | PATH
# TYPE: home (~/ або ${HOME}/), system (/etc/...), порожній (/абсолютний/шлях)
# Порядок та групи визначаються заголовками [group].

# ─── Shell ──────────────────────────────────────────────────────────────────
[shell]
zshenv | home | ~/.zshenv
zsh | home | ~/.config/zsh

# ─── загальне ─────────────────────────────────────────────────────────
[font]
fonts | home | ~/.local/share/fonts
fonts-conf | home | ~/.config/fontconfig

# ─── Термінал / CLI ─────────────────────────────────────────────────────────
[terminal]
kitty | home | ~/.config/kitty
wezterm | home | ~/.config/wezterm
nvim | home | ~/.config/nvim
starship | home | ~/.config/starship
fzf | home | ~/.config/fzf
eza | home | ~/.config/eza
bat | home | ~/.config/bat
superfile | home | ~/.config/superfile
yazi | home | ~/.config/yazi
helix | home | ~/.config/helix

# ─── KDE / Desktop ──────────────────────────────────────────────────────────
[desktop]
kdeglobals | home | ~/.config/kdeglobals
kwinrc | home | ~/.config/kwinrc
kglobalshortcutsrc | home | ~/.config/kglobalshortcutsrc
katerc | home | ~/.config/katerc
dolphinrc | home | ~/.config/dolphinrc
konsolerc | home | ~/.config/konsolerc
krusaderrc | home | ~/.config/krusaderrc
plasmashellrc | home | ~/.config/plasmashellrc
plasma-org | home | ~/.config/plasma-org.kde.plasma.desktop-appletsrc
mimeapps | home | ~/.config/mimeapps.list
menus | home | ~/.config/menus
Kvantum | home | ~/.config/Kvantum
gtk-3 | home | ~/.config/gtk-3.0
gtk-4 | home | ~/.config/gtk-4.0
QtProject | home | ~/.config/QtProject.conf
Trolltech | home | ~/.config/Trolltech.conf

[samba]
samba | system | /etc/samba/smb.conf
