# ============================================================
# 1. ЗАГАЛЬНІ НАЛАШТУВАННЯ
# ============================================================

# Додавати порожній рядок між завершеною командою
# та наступним запрошенням термінала.
add_newline = true

# Максимальний час пошуку файлів для визначення проєкту.
scan_timeout = 30

# Максимальний час виконання зовнішньої команди.
command_timeout = 800

# Використовувати визначену нижче палітру кольорів.
palette = "catppuccin_mocha"


# ============================================================
# 2. ФОРМАТ ЗАПРОШЕННЯ (PROMPT)
# ============================================================

format = """
$os\
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$git_state\
$python\
$nodejs\
$rust\
$golang\
${custom.container_status}\
$line_break\
$status\
$character"""

# Модулі праворуч від основного запрошення.
right_format = """
$cmd_duration\
$jobs$time"""


# ============================================================
# 3. КОЛЬОРОВА ПАЛІТРА CATPPUCCIN MOCHA
# ============================================================

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#BF616A"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#61AFEF"
# blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext = "#a6adc8"
overlay = "#6c7086"
surface = "#45475a"


# ============================================================
# 4. ОПЕРАЦІЙНА СИСТЕМА
# ============================================================

[os]
disabled = false
format = "[$symbol ]($style)"
style = "bold blue"

[os.symbols]
Arch = "󰣇"
Fedora = "󰣛"
Ubuntu = "󰕈"
Debian = "󰣚"
Linux = "󰌽"


# ============================================================
# 5. ІМ'Я КОРИСТУВАЧА
# ============================================================

[username]
show_always = false
style_user = "green"
style_root = "bold red"
format = "[$user]($style) "


# ============================================================
# 6. ІМ'Я КОМП'ЮТЕРА / SSH
# ============================================================

[hostname]
ssh_only = true
style = "bold yellow"
format = "[@$hostname]($style) "


# ============================================================
# 7. ПОТОЧНИЙ КАТАЛОГ
# ============================================================

[directory]
style = "bold blue"
format = "[$path]($style)[$read_only]($read_only_style) "
home_symbol = "~"
truncation_length = 5
truncation_symbol = "…/"
truncate_to_repo = false
read_only = " 󰌾"
read_only_style = "red"


# ============================================================
# 8. ПОТОЧНА ГІЛКА GIT
# ============================================================

[git_branch]
symbol = " "
style = "bold mauve"
format = "[$symbol$branch]($style)"


# ============================================================
# 9. СТАН GIT-РЕПОЗИТОРІЮ
# ============================================================

[git_status]
style = "bold yellow"
format = '([$all_status$ahead_behind]($style) )'

conflicted = " =${count} "
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕⇡${ahead_count} ⇣${behind_count}"
untracked = " ?${count}"
stashed = " 󰏗${count}"
modified = " !${count}"
staged = " +${count}"
renamed = " »${count}"
deleted = " ✘${count}"


# ============================================================
# 10. ПОТОЧНИЙ СТАН ОПЕРАЦІЙ GIT
# ============================================================

[git_state]
style = "bold red"
format = '[$state( $progress_current/$progress_total)]($style) '


# ============================================================
# 11. PYTHON
# ============================================================

[python]
symbol = " "
style = "yellow"
format = 'via [$symbol$version( \($virtualenv\))]($style) '


# ============================================================
# 12. NODE.JS
# ============================================================

[nodejs]
symbol = " "
style = "green"
format = "via [$symbol$version]($style) "


# ============================================================
# 13. RUST
# ============================================================

[rust]
symbol = " "
style = "peach"
format = "via [$symbol$version]($style) "


# ============================================================
# 14. GOLANG
# ============================================================

[golang]
symbol = " "
style = "sky"
format = "via [$symbol$version]($style) "


# ============================================================
# 15. CONTAINERS — PODMAN / DOCKER
# ============================================================

[custom.container_status]
disabled = false
description = "Стан Compose-контейнерів"
command = 'bash "${XDG_CONFIG_HOME:-$HOME/.config}/starship/scripts/container-status.sh"'
when = true
format = "[$output]($style) "
style = "bold"
shell = ["bash"]

# ============================================================
# 16. ТРИВАЛІСТЬ ВИКОНАННЯ КОМАНДИ
# ============================================================

[cmd_duration]
min_time = 2000
show_milliseconds = false
style = "bold yellow"
format = "󱎫 [$duration]($style) "


# ============================================================
# 17. ФОНОВІ ЗАВДАННЯ
# ============================================================

[jobs]
symbol = "󰜎 "
style = "bold peach"
format = "[$symbol$number]($style) "


# ============================================================
# 18. ПОТОЧНИЙ ЧАС
# ============================================================

[time]
disabled = false
time_format = "%H:%M"
style = "dimmed overlay"
format = "[$time]($style)"


# ============================================================
# 19. СТАТУС ПОПЕРЕДНЬОЇ КОМАНДИ
# ============================================================

[status]
disabled = false
format = "[$symbol $status]($style) "
symbol = "✘"
success_symbol = ""
style = "bold red"
map_symbol = true


# ============================================================
# 20. СИМВОЛ ВВЕДЕННЯ КОМАНД
# ============================================================

[character]
disabled = false

# Успішне виконання попередньої команди.
success_symbol = "[➜](bold green)"

# Попередня команда завершилася з помилкою.
error_symbol = "[➜](bold red)"

# Vi normal mode.
vimcmd_symbol = "[❮](bold mauve)"

# Vi replace-one mode.
vimcmd_replace_one_symbol = "[❮](bold peach)"

# Vi replace mode.
vimcmd_replace_symbol = "[❮](bold peach)"

# Vi visual mode.
vimcmd_visual_symbol = "[❮](bold yellow)"


# ============================================================
# 21. ВИМКНЕНІ МОДУЛІ
# ============================================================

[package]
disabled = true

[aws]
disabled = true

[gcloud]
disabled = true

[azure]
disabled = true

