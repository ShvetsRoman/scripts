include keymap.conf

include themes/Nordic.conf
# include themes/Galaxy.conf
# include themes/Alucard.conf
# include themes/Bright_Lights.conf
# include themes/Apprentice.conf
# include themes/Solarized_Darcula.conf

# Fonts
font_family JetbrainsMono Nerd Font
font_size 16.0

# Window
background_opacity 0.70
background_blur 10
window_margin 5

remember_window_size no
initial_window_width 115c
initial_window_height 35c

enabled_layouts splits,tall,fat,grid,stack

# Cursor customization
# cursor green
cursor yellow
# cursor_shape beam
# cursor_trail 2

###
confirm_os_window_close 0

# Не встановлювати заголовок через shell integration
shell_integration no-title

# ВКЛАДКИ (TABS)
# Розташування вкладок угорі
tab_bar_edge top

# Стиль вкладок
tab_bar_style powerline

# Назва вкладки — тільки запущена програма
tab_title_template "{title}"
active_tab_title_template "{title}"
# tab_title_template "{tab.active_exe}"
# active_tab_title_template "{tab.active_exe}"

# Показувати панель навіть з однією вкладкою
tab_bar_min_tabs 1

# Вирівнювання вкладок зліва
tab_bar_align left
