# KITTY — ОСНОВНА КОНФІГУРАЦІЯ

# Підключити окремий файл з гарячими клавішами.
# Файл розташований у ~/.config/kitty/keymap.conf.
include keymap.conf

# Активна кольорова тема Nordic.
include themes/Nordic.conf
# include themes/Galaxy.conf
# include themes/Alucard.conf
# include themes/Bright_Lights.conf
# include themes/Apprentice.conf
# include themes/Solarized_Darcula.conf

# Основний шрифт із підтримкою Nerd Fonts.
font_family JetbrainsMono Nerd Font

# Розмір шрифту в пунктах.
font_size 16.0

# Прозорість фону:
# 1.0 — повністю непрозорий;
# 0.7 — 70% непрозорості;
# 0.0 — повністю прозорий.
background_opacity 0.70

# Розмиття фону за прозорим вікном.
background_blur 10

# Зовнішні відступи навколо вікна термінала.
window_margin_width 5

# Не запам'ятовувати розмір вікна після закриття.
remember_window_size no

# Початкова ширина вікна у стовпцях символів.
initial_window_width 115c

# Початкова висота вікна у рядках символів.
initial_window_height 35c

# Доступні способи розміщення панелей:
# splits — ручне горизонтальне/вертикальне розділення;
# tall   — основна велика панель та додаткові збоку;
# fat    — основна велика панель та додаткові знизу;
# grid   — розташування панелей у вигляді сітки;
# stack  — панелі накладаються одна на одну.
# Перша розкладка використовується за замовчуванням.
enabled_layouts splits,tall,fat,grid,stack

# Колір курсора.
# Можна використовувати назву або HEX-код.
#
# cursor green
cursor yellow

# Форма курсора:
# block — прямокутний блок;
# beam  — вертикальна риска;
# underline — підкреслення.
# Залишаємо стандартну форму.
# cursor_shape beam

# Слід курсора під час його переміщення.
# Значення задає порогову відстань для анімації.
# cursor_trail 2

# Закривати вікно без додаткового підтвердження.
confirm_os_window_close 0

# Вимкнути автоматичне встановлення заголовка вікна
shell_integration no-title

# Розташувати панель вкладок угорі вікна.
tab_bar_edge top

# Вирівнювання вкладок по лівому краю.
tab_bar_align left

# Стиль вкладок із роздільниками Powerline.
# Інші варіанти: slant, fade, separator, hidden.
tab_bar_style powerline

# Кутові роздільники Powerline.
tab_powerline_style angled

# Максимальна довжина заголовка вкладки.
# 0 — без обмеження.
tab_title_max_length 20

# Показувати панель, коли відкрито від двох вкладок.
# 1 — показувати навіть з однією вкладкою.
tab_bar_min_tabs 2

# ЗАГОЛОВКИ ВКЛАДОК (TAB TITLES)
tab_title_template "{index}: {tab.active_exe}"

# Активна вкладка:
# Колір і жирність задаються окремими параметрами нижче.
active_tab_title_template "● {index}: {tab.active_exe}"

# Активна вкладка
# Фон: Nord Frost — приглушений синій.
active_tab_background #5E81AC

# Текст: Nord Snow Storm — світлий майже білий.
active_tab_foreground #ECEFF4

# Жирний шрифт активної вкладки.
active_tab_font_style bold

# Неактивні вкладки
# Темний фон неактивних вкладок.
inactive_tab_background #3B4252

# Приглушений світло-сірий текст.
inactive_tab_foreground #D8DEE9

# Звичайний шрифт неактивних вкладок.
inactive_tab_font_style normal

# Фон усієї панелі вкладок
# Основний темний колір Nord Polar Night.
tab_bar_background #2E3440

# Фон порожнього простору панелі вкладок
tab_bar_background #242933

# Колір відступів панелі вкладок
tab_bar_margin_color #242933
