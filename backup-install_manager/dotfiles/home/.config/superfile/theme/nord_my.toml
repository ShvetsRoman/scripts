# Колір заголовків.
help_menu_title = "#88c0d0"


###############################################################################
#                                   Special                                   #
###############################################################################

# Курсор та активний елемент.
cursor = "#88c0d0"

# Успішні операції.
correct = "#a3be8c"

# Помилки та небезпечні операції.
error = "#bf616a"

# Підказки.
hint = "#8fbcbb"

# Скасування.
cancel = "#d8dee9"
