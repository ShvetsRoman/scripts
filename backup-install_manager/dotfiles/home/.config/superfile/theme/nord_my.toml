# Основні кольори:
#   Фон                #2e3440
#   Темніший фон       #3b4252
#   Рамки              #4c566a
#   Основний текст     #e5e9f0
#   Основний синій     #61AFEF 
#   Світлий синій      #88c0d0
#   Бірюзовий          #8fbcbb
#   Зелений            #a3be8c
#   Фіолетовий         #b48ead
#   Червоний           #bf616a

###############################################################################
#                           Code Syntax Highlighting                          #
###############################################################################

# Підсвічування синтаксису у вбудованому preview.
code_syntax_highlight = "nord"


###############################################################################
#                                 Base Colors                                 #
###############################################################################

# -----------------------------------------------------------------------------
# Full Screen
# -----------------------------------------------------------------------------

# Основний колір тексту.
full_screen_fg = "#e5e9f0"

# Основний фон.
#
# Якщо у config.toml встановлено:
#
# transparent_background = true
#
# тоді буде використовуватися прозорість термінала.
full_screen_bg = "#2e3440"


# -----------------------------------------------------------------------------
# Gradient
# -----------------------------------------------------------------------------

# Градієнт інтерфейсу.
#
# Superfile підтримує два кольори.
gradient_color = ["#61AFEF", "#88c0d0"]


# -----------------------------------------------------------------------------
# Directory Icons
# -----------------------------------------------------------------------------

# Колір іконок звичайних директорій.
directory_icon_color = "#61AFEF"


###############################################################################
#                                  File Panel                                 #
###############################################################################

# Основний колір назв файлів.
file_panel_fg = "#e5e9f0"

# Фон файлової панелі.
file_panel_bg = "#2e3440"

# Рамка неактивної файлової панелі.
file_panel_border = "#4c566a"

# Рамка активної файлової панелі.
file_panel_border_active = "#81a1c1"

# Іконка переходу у батьківську директорію.
file_panel_top_directory_icon = "#61AFEF"

# Поточний шлях у верхній частині панелі.
file_panel_top_path = "#61AFEF"

# Колір тексту вибраного елемента.
file_panel_item_selected_fg = "#e5e9f0"

# Фон вибраного елемента.
file_panel_item_selected_bg = "#3b4252"


###############################################################################
#                                   Footer                                    #
###############################################################################

# Основний колір тексту footer.
footer_fg = "#e5e9f0"

# Фон footer.
footer_bg = "#2e3440"

# Рамка неактивного footer.
footer_border = "#4c566a"

# Рамка активного footer.
footer_border_active = "#81a1c1"


###############################################################################
#                                   Sidebar                                   #
###############################################################################

# Основний колір тексту та іконок у лівій панелі.
sidebar_fg = "#61AFEF"

# Фон Sidebar.
sidebar_bg = "#2e3440"

# Заголовки секцій:
# Home / Pinned / Disks.
sidebar_title = "#61AFEF"

# Рамка Sidebar.
sidebar_border = "#4c566a"

# Рамка активного Sidebar.
sidebar_border_active = "#81a1c1"

# Колір тексту вибраного пункту.
sidebar_item_selected_fg = "#e5e9f0"

# Фон вибраного пункту.
sidebar_item_selected_bg = "#3b4252"

# Роздільник між секціями Sidebar.
sidebar_divider = "#4c566a"


###############################################################################
#                                   Modals                                    #
###############################################################################

# Основний колір тексту модального вікна.
modal_fg = "#e5e9f0"

# Фон модального вікна.
modal_bg = "#2e3440"

# Активна рамка модального вікна.
modal_border_active = "#81a1c1"


# -----------------------------------------------------------------------------
# Cancel Button
# -----------------------------------------------------------------------------

# Текст кнопки скасування.
modal_cancel_fg = "#e5e9f0"

# Фон кнопки скасування.
modal_cancel_bg = "#4c566a"


# -----------------------------------------------------------------------------
# Confirm Button
# -----------------------------------------------------------------------------

# Текст кнопки підтвердження.
modal_confirm_fg = "#2e3440"

# Фон кнопки підтвердження.
modal_confirm_bg = "#88c0d0"


###############################################################################
#                                  Help Menu                                  #
###############################################################################

# Колір гарячих клавіш.
