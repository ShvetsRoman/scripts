###############################################################################
#                         SUPERFILE — CONFIGURATION                           #
#                         Конфігурація файлового менеджера                    #
###############################################################################

# Документація:
# https://superfile.dev/configure/superfile-config/

# ============================================================
# РЕДАКТОРИ
# ============================================================

# Редактор файлів.
# Порожнє значення використовує змінну середовища $EDITOR.
# У твоєму випадку це Neovim.
editor = ""

# Редактор каталогів.
# Явно вказуємо Neovim, оскільки порожнє значення
# використовує системний редактор за замовчуванням (vi у Linux).
dir_editor = "nvim"


# ============================================================
# ОСНОВНІ НАЛАШТУВАННЯ
# ============================================================

# Назва теми оформлення.
theme = "nord_my"

# Автоматично перевіряти наявність оновлень.
# true  — перевіряти (не частіше одного разу на день).
# false — вимкнути перевірку.
auto_check_update = false

# Перехід у останній відкритий каталог після виходу.
# true  — змінити поточний каталог термінала.
# false — залишити початковий каталог.
# Потребує shell-функції spf у конфігурації Zsh.
cd_on_quit = true

# ============================================================
# ПОПЕРЕДНІЙ ПЕРЕГЛЯД ФАЙЛІВ
# ============================================================

# Автоматично відкривати панель попереднього перегляду.
default_open_file_preview = true

# Показувати попередній перегляд зображень.
show_image_preview = true

# Показувати додаткову інформацію в нижній частині панелі.
show_panel_footer_info = false

# ============================================================
# ПОЧАТКОВИЙ КАТАЛОГ
# ============================================================

# Каталог, який відкривається під час запуску.
# "."  — поточний каталог.
# "~"  — домашній каталог.
default_directory = "."

# ============================================================
# ВІДОБРАЖЕННЯ РОЗМІРІВ ФАЙЛІВ
# ============================================================

# Одиниці вимірювання розміру файлів.
# true  — десяткові: kB, MB, GB (1000).
# false — двійкові: KiB, MiB, GiB (1024).
file_size_use_si = false

# ============================================================
# СОРТУВАННЯ ФАЙЛІВ
# ============================================================

# Тип сортування:
# 0 — за назвою.
# 1 — за розміром.
# 2 — за датою зміни.
# 3 — за типом.
# 4 — природне сортування (file2 перед file10).
default_sort_type = 0

# Зворотний порядок сортування.
# false — за зростанням.
# true  — за спаданням.
sort_order_reversed = false

# Регістр символів під час сортування.
# false — без урахування регістру.
# true  — з урахуванням регістру.
case_sensitive_sort = false

# ============================================================
# КОМАНДНИЙ РЯДОК
# ============================================================

# Закривати командний рядок після успішного виконання команди.
# false — залишати відкритим.
# true  — автоматично закривати.
shell_close_on_success = false

# ============================================================
# ДІАГНОСТИКА
# ============================================================

# Режим налагодження.
# true  — докладніші журнали.
# false — звичайне журналювання.
debug = false

# Ігнорувати попередження про відсутні поля конфігурації.
# false — показувати попередження.
# true  — приховувати попередження.
ignore_missing_fields = false

# ============================================================
# ПРОКРУЧУВАННЯ
# ============================================================

# Кількість рядків прокручування PgUp / PgDown.
# 0 — прокручування на цілу сторінку.
# Інше число — вказана кількість рядків.
page_scroll_size = 0

# ============================================================
# КОЛОНКИ ФАЙЛОВОЇ ПАНЕЛІ
# ============================================================

# Кількість додаткових колонок:
# 0 — вимкнено.
# 1 — розмір файлу.
# 2 — дата зміни.
# 3 — права доступу.
file_panel_extra_columns = 0

# Відсоток ширини панелі для назв файлів.
# Діапазон: 25–100.
# Більше значення — більше місця для назв.
file_panel_name_percent = 50


###############################################################################
#                                ОФОРМЛЕННЯ                                   #
###############################################################################

# ============================================================
# ІКОНКИ
# ============================================================

# Використовувати Nerd Fonts.
# Потребує встановленого Nerd Font.
nerdfont = true

# Показувати іконки вибору файлів у режимі виділення.
# Працює лише разом із nerdfont = true.
show_select_icons = true

# ============================================================
# ПРОЗОРІСТЬ
# ============================================================

# Не малювати фон Superfile.
# true  — використовувати прозорий фон термінала.
# false — використовувати фон теми.
transparent_background = true

# ============================================================
# ПАНЕЛЬ ПОПЕРЕДНЬОГО ПЕРЕГЛЯДУ
# ============================================================

# Ширина панелі Preview.
# 0 — така сама ширина, як у файлової панелі.
# 2–10 — ширина становить 1/X доступної ширини.
file_preview_width = 0

# Показувати рамку навколо Preview.
enable_file_preview_border = true

# ============================================================
# ПІДСВІЧУВАННЯ СИНТАКСИСУ
# ============================================================

# Механізм підсвічування тексту:
# ""    — вбудований Chroma.
# "bat" — зовнішній переглядач bat.
code_previewer = "bat"

# ============================================================
# БОКОВА ПАНЕЛЬ
# ============================================================

# Ширина Sidebar без урахування рамок.
# 0 — приховати панель.
# Допустимий діапазон: 5–20.
sidebar_width = 20

# Порядок секцій Sidebar.
# Доступні секції:
# "home"   — домашні каталоги.
# "pinned" — закріплені каталоги.
# "disks"  — диски та файлові системи.
sidebar_sections = ["home", "pinned", "disks"]

# ============================================================
# РАМКИ ПАНЕЛЕЙ
# ============================================================

# Символи верхньої та нижньої межі.
border_top = "─"
border_bottom = "─"

# Символи лівої та правої межі.
border_left = "│"
border_right = "│"

# Кути рамок.
border_top_left = "╭"
border_top_right = "╮"
border_bottom_left = "╰"
border_bottom_right = "╯"

# З'єднання рамок між панелями.
border_middle_left = "├"
border_middle_right = "┤"


###############################################################################
#                                  ПЛАГІНИ                                    #
###############################################################################

# ============================================================
# МЕТАДАНІ ФАЙЛІВ
# ============================================================

# Детальні метадані файлів.
# Потребує встановленого exiftool.
metadata = false

# ============================================================
# КОНТРОЛЬНІ СУМИ
# ============================================================

# Генерувати MD5 для звичайних файлів.
# Може сповільнювати роботу на великих файлах.
enable_md5_checksum = false

# ============================================================
# ZOXIDE
# ============================================================

# Інтеграція з zoxide.
# true  — увімкнути навігацію через zoxide (клавіша z).
# false — вимкнути.
# Потребує встановленого zoxide.
zoxide_support = true
