# ============================================
# Manager
# ============================================

[mgr]

cwd = { fg = "#88C0D0" }

hovered = { reversed = true }
preview_hovered = { underline = true }

find_keyword = { fg = "#EBCB8B", bold = true, italic = true, underline = true }
find_position = { fg = "#B48EAD", bg = "reset", bold = true, italic = true }

marker_copied = { fg = "#A3BE8C", bg = "#A3BE8C" }
marker_cut = { fg = "#BF616A", bg = "#BF616A" }
marker_marked = { fg = "#8FBCBB", bg = "#8FBCBB" }
marker_selected = { fg = "#EBCB8B", bg = "#EBCB8B" }

tab_active = { reversed = true }
tab_inactive = { fg = "#4C566A" }
tab_width = 1

count_copied = { fg = "#2E3440", bg = "#A3BE8C" }
count_cut = { fg = "#2E3440", bg = "#BF616A" }
count_selected = { fg = "#2E3440", bg = "#EBCB8B" }

border_symbol = "│"
border_style = { fg = "#4C566A" }

# ============================================
# Tabs
# ============================================

[tabs]

active = { fg = "#2E3440", bg = "#8FBCBB", bold = true }
inactive = { fg = "#8FBCBB", bg = "#3B4252" }

# ============================================
# Mode
# ============================================

[mode]

normal_main = { fg = "#2E3440", bg = "#8FBCBB", bold = true }
normal_alt = { fg = "#8FBCBB", bg = "#3B4252" }

select_main = { fg = "#2E3440", bg = "#8FBCBB", bold = true }
select_alt = { fg = "#8FBCBB", bg = "#3B4252" }

unset_main = { fg = "#2E3440", bg = "#BF616A", bold = true }
unset_alt = { fg = "#BF616A", bg = "#3B4252" }

# ============================================
# Status
# ============================================

[status]

perm_sep = { fg = "#4C566A" }
perm_type = { fg = "#61AFEF" }
perm_read = { fg = "#EBCB8B" }
perm_write = { fg = "#BF616A" }
perm_exec = { fg = "#A3BE8C" }

progress_label = { fg = "#ECEFF4", bold = true }
progress_normal = { fg = "#88C0D0", bg = "#434C5E" }
progress_error = { fg = "#BF616A", bg = "#434C5E" }

# ============================================
# Pick
# ============================================

[pick]

border = { fg = "#81A1C1" }
active = { fg = "#B48EAD", bold = true }
inactive = { fg = "#D8DEE9" }

# ============================================
# Input
# ============================================

[input]

border = { fg = "#81A1C1" }
title = { fg = "#D8DEE9" }
value = { fg = "#ECEFF4" }
selected = { reversed = true }

# ============================================
# Completion
# ============================================

[cmp]

border = { fg = "#81A1C1" }

# ============================================
# Tasks
# ============================================

[tasks]

border = { fg = "#81A1C1" }
title = { fg = "#ECEFF4" }
hovered = { fg = "#B48EAD", underline = true }

# ============================================
# Which
# ============================================

[which]

mask = { bg = "#3B4252" }
cand = { fg = "#8FBCBB" }
rest = { fg = "#4C566A" }
desc = { fg = "#B48EAD" }
separator = "  "
separator_style = { fg = "#434C5E" }

# ============================================
# Help
# ============================================

[help]

on = { fg = "#8FBCBB" }
run = { fg = "#B48EAD" }
hovered = { reversed = true, bold = true }
footer = { fg = "#2E3440", bg = "#ECEFF4" }

# ============================================
# Notify
# ============================================

[notify]

title_info = { fg = "#A3BE8C" }
title_warn = { fg = "#EBCB8B" }
title_error = { fg = "#BF616A" }

# ============================================
# File styles
# ============================================

[filetype]

rules = [
    # Пошкоджені символічні посилання
    { url = "*", is = "orphan", fg = "#BF616A" },

    # Символічні посилання
    { url = "*", is = "link", fg = "#B48EAD" },

    # Папки
    { url = "*/", fg = "#61AFEF", bold = true },

    # Зображення
    { mime = "image/*", fg = "#8FBCBB" },

    # Аудіо
    { mime = "audio/*", fg = "#EBCB8B" },

    # Відео
    { mime = "video/*", fg = "#EBCB8B" },

    # Архіви
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#B48EAD" },

    # PDF та документи
    { mime = "application/{pdf,doc,rtf,odt,docx,xlsx,pptx}", fg = "#A3BE8C" },

    # Виконувані файли
    { url = "*", is = "exec", fg = "#A3BE8C" },

    # Звичайні файли
    { url = "*", fg = "#D8DEE9" },
]

# ============================================
# Icons
# ============================================

[icon]

# Вимикаємо іменні іконки директорій
dirs = []

prepend_conds = [
    # Пошкоджене посилання
    { if = "orphan", text = "", fg = "#BF616A" },

    # Символічне посилання
    { if = "link", text = "", fg = "#B48EAD" },

    # Відкрита папка під курсором
    { if = "dir & hovered", text = "", fg = "#61AFEF" },

    # Закрита папка
    { if = "dir", text = "", fg = "#61AFEF" },
]

