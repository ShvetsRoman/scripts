#!/usr/bin/env bash

# ============================================================
# МАПІНГ КОНФІГУРАЦІЙ INSTALLER PACKAGES V1.5
# ============================================================
# Формат:
#   [ID]="MODULE|SCOPE|SOURCE|DESTINATION"
# Де:
#   ID          — унікальний ID конфігу;
#   MODULE      — модуль, якому належить конфіг;
#   SCOPE       — home або system;
#   SOURCE      — шлях відносно DOTFILES_DIR;
#   DESTINATION — шлях призначення.
# MODULE_CONFIGS вручну НЕ заповнюється.
# Він будується автоматично з CONFIG_MAP під час запуску.
# ============================================================

declare -Ag CONFIG_MAP=(
    # --------------------------------------------------------
    # CLI
    # --------------------------------------------------------
    [nvim]="cli|home|.config/nvim|.config/nvim"
    [kitty]="cli|home|.config/kitty|.config/kitty"
    [wezterm]="cli|home|.config/wezterm|.config/wezterm"

    # --------------------------------------------------------
    # SHELL
    # --------------------------------------------------------
    [zsh]="shell|home|.zshrc|.zshrc"
    [zsh-alias]="shell|home|.zsh_alias.zsh|.zsh_alias.zsh"
    [zsh-path]="shell|home|.zsh_path.zsh|.zsh_path.zsh"
    [starship]="shell|home|.config/starship|.config/starship"
)

# Генерується функцією build_module_configs().
declare -Ag MODULE_CONFIGS=()
