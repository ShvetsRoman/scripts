# ============================================================
# ЗОВНІШНІ / GITHUB ПАКЕТИ
# ============================================================
# Підтримувані TYPE:
#
# 1) script
#    [ID]="script|URL|CHECK_COMMAND"
#
#    Завантажує install script через curl і запускає через bash.
#
# 2) git
#    [ID]="git|REPOSITORY_URL|CHECK_COMMAND|DEST_DIR|EXECUTABLE_REL"
#
#    Клонує git-репозиторій у DEST_DIR і створює symlink:
#      ~/.local/bin/CHECK_COMMAND -> DEST_DIR/EXECUTABLE_REL
#
# 3) binary
#    [ID]="binary|BINARY_URL|CHECK_COMMAND|DEST_FILE"
#
#    Завантажує готовий executable-файл, робить його виконуваним
#    і встановлює в DEST_FILE. Для /usr/* використовується sudo.
#
# CHECK_COMMAND — команда для Status/Verify і перевірки результату.
# У DEST_DIR / DEST_FILE можна використовувати ~.
# ============================================================

# shellcheck disable=SC2034
declare -Ag GITHUB_PACKAGES=(
    # Install script
    [superfile]="script|https://superfile.dev/install.sh|spf"

    # Приклади для майбутнього використання:
    # [my-git-tool]="git|https://github.com/user/repo.git|mytool|~/.local/share/mytool|bin/mytool"
    # [my-binary]="binary|https://github.com/user/repo/releases/download/v1.0/mytool|mytool|~/.local/bin/mytool"
)
