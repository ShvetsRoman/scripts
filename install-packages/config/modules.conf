#!/usr/bin/env bash

# ============================================================
# ЦЕНТРАЛЬНИЙ РЕЄСТР МОДУЛІВ V1.5
# ============================================================
#
# MODULES              — порядок модулів у menu/all.
# MODULE_TITLES        — назви для UI.
# MODULE_DEPENDENCIES  — залежності.
# MODULE_PACMAN_ARRAYS — ім'я масиву pacman-пакетів або "".
# MODULE_AUR_ARRAYS    — ім'я масиву AUR-пакетів або "".
# MODULE_SERVICES      — systemd-сервіси.
# MODULE_POST_HOOKS    — post-install hook.
#
# Конфіги тут НЕ вказуються: належність конфігу до модуля
# береться безпосередньо з CONFIG_MAP.
# ============================================================

MODULES=(
    base
    cli
    shell
    dev
    docker
    network
    office
    kde
    desktop
    image
    multimedia
)

declare -Ag MODULE_TITLES=(
    [base]="Base"
    [cli]="CLI"
    [shell]="Shell"
    [dev]="Development"
    [docker]="Docker"
    [network]="Network"
    [office]="Office"
    [kde]="KDE"
    [desktop]="Desktop"
    [image]="Image"
    [multimedia]="Multimedia"
)

declare -Ag MODULE_DEPENDENCIES=(
    [base]=""
    [cli]=""
    [shell]=""
    [dev]=""
    [docker]=""
    [network]=""
    [office]=""
    [kde]=""
    [desktop]=""
    [image]=""
    [multimedia]=""
)

declare -Ag MODULE_PACMAN_ARRAYS=(
    [base]="BASE_PACKAGES"
    [cli]="CLI_PACKAGES"
    [shell]="SHELL_PACKAGES"
    [dev]="DEV_PACKAGES"
    [docker]="DOCKER_PACKAGES"
    [network]="NETWORK_PACKAGES"
    [office]="OFFICE_PACKAGES"
    [kde]="KDE_PACKAGES"
    [desktop]="DESKTOP_PACKAGES"
    [image]="IMAGE_PACKAGES"
    [multimedia]="MULTIMEDIA_PACKAGES"
)

declare -Ag MODULE_AUR_ARRAYS=(
    [base]=""
    [cli]=""
    [shell]=""
    [dev]=""
    [docker]=""
    [network]=""
    [office]=""
    [kde]=""
    [desktop]="DESKTOP_AUR_PACKAGES"
    [image]=""
    [multimedia]="MULTIMEDIA_AUR_PACKAGES"
)

declare -Ag MODULE_SERVICES=(
    [base]=""
    [cli]=""
    [shell]=""
    [dev]=""
    [docker]="docker"
    [network]=""
    [office]=""
    [kde]=""
    [desktop]=""
    [image]=""
    [multimedia]=""
)

declare -Ag MODULE_POST_HOOKS=(
    [base]=""
    [cli]=""
    [shell]="configure_default_shell"
    [dev]=""
    [docker]="configure_docker_user"
    [network]=""
    [office]=""
    [kde]=""
    [desktop]=""
    [image]=""
    [multimedia]=""
)
