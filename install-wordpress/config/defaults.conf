#!/usr/bin/env bash

readonly VERSION="2.0.9"

# РЕЖИМ РОЗГОРТАННЯ ТА ДОМЕН
# Режим розгортання проєкту.
DEPLOY_MODE=""
# Доменне ім'я проєкту.
DOMAIN=""
# Чи було доменне ім'я явно вказане користувачем.
DOMAIN_EXPLICIT=false

# EMAIL ТА ACME
# Email для реєстрації та роботи ACME (Let's Encrypt).
ACME_EMAIL=""
# Використовувати тестове середовище ACME замість production.
ACME_STAGING=false
# Email адміністратора проєкту.
ADMIN_EMAIL=""
# Чи було email адміністратора явно вказано користувачем.
ADMIN_EMAIL_EXPLICIT=false

# КАТАЛОГ ТА НАЗВА ПРОЄКТУ
# Абсолютний шлях до каталогу встановлення проєкту.
INSTALL_DIR=""
# Назва проєкту.
PROJECT_NAME=""
# Чи була назва проєкту явно вказана користувачем.
PROJECT_NAME_EXPLICIT=false

# SSH
# Порт SSH-сервера.
SSH_PORT="2241"

# БЕЗПЕКА ТА КЕРУВАННЯ СЕРВІСАМИ
# Дозволити автоматичне налаштування брандмауера.
MANAGE_FIREWALL=false
# Увімкнути захист Fail2Ban від підбору паролів.
ENABLE_FAIL2BAN=false
# Не запускати контейнери після встановлення.
NO_START=false
# Примусове виконання операцій, які зазвичай потребують підтвердження.
FORCE=false

# СИСТЕМНІ ВИМОГИ
# Мінімальний необхідний вільний простір на диску (ГБ).
MIN_FREE_SPACE_GB="5"

# WORDPRESS

# Назва сайту WordPress за замовчуванням.
WORDPRESS_TITLE="My WordPress Site"
# Ім'я адміністратора WordPress за замовчуванням.
WORDPRESS_ADMIN_USER="admin"

# MYSQL
# Назва бази даних WordPress.
MYSQL_DATABASE="wordpress"
# Ім'я користувача MySQL для WordPress.
MYSQL_USER="wp_user"

# ВЕРСІЇ DOCKER-ОБРАЗІВ
# Версія зворотного проксі Traefik.
TRAEFIK_VERSION="3.7.13"
# Версія WordPress із PHP 8.3 FPM на Alpine Linux.
WORDPRESS_VERSION="php8.3-fpm-alpine"
# Версія сервера баз даних MySQL.
MYSQL_VERSION="8.4.11"
# Версія вебсервера Nginx на Alpine Linux.
NGINX_VERSION="1.29-alpine"
# Версія WP-CLI з PHP 8.3.
WPCLI_VERSION="cli-php8.3"

# ЛІМІТИ PHP
# Максимальний обсяг пам'яті, доступний PHP.
MEMORY_LIMIT="512M"
# Максимальний розмір одного завантажуваного файлу.
UPLOAD_MAX_FILESIZE="128M"
# Максимальний розмір POST-запиту.
POST_MAX_SIZE="128M"
# Максимальний час виконання PHP-скрипту (секунди).
MAX_EXECUTION_TIME="300"
# Максимальна кількість вхідних змінних PHP.
MAX_INPUT_VARS="3000"

# DOCKER NETWORK
# Підмережа Docker для frontend-мережі.
FRONTEND_SUBNET="172.28.0.0/16"

# ОБМЕЖЕННЯ РЕСУРСІВ DOCKER
# Максимальний обсяг оперативної пам'яті для Traefik.
TRAEFIK_MEM_LIMIT="256m"
# Максимальний обсяг оперативної пам'яті для Nginx.
NGINX_MEM_LIMIT="256m"
# Максимальний обсяг оперативної пам'яті для WordPress.
WORDPRESS_MEM_LIMIT="512m"
# Максимальний обсяг оперативної пам'яті для MySQL.
DB_MEM_LIMIT="1024m"
# Максимальний обсяг оперативної пам'яті для WP-CLI.
WPCLI_MEM_LIMIT="256m"
# Максимальна кількість процесів для звичайних контейнерів.
PIDS_LIMIT="128"
# Максимальна кількість процесів для контейнера бази даних.
DB_PIDS_LIMIT="300"

# РЕЗЕРВНЕ КОПІЮВАННЯ
# Кількість днів зберігання резервних копій.
BACKUP_RETENTION_DAYS="30"
